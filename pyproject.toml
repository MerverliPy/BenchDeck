[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "benchdeck"
version = "0.1.0"
description = "Evidence-preserving LLM agent benchmark harness with a live mobile-first SSH TUI."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "MerverliPy"}]
dependencies = [
  "openai>=2.0.0",
  "pydantic>=2.8.0",
  "jsonschema>=4.23.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.9.0",
  "mypy>=1.14.0",
  "types-jsonschema>=2.0.0",
]

[project.scripts]
benchdeck = "benchdeck.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
benchdeck = ["schemas/*.json"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"scripts/generate_demo_screens.py" = ["E501", "E741"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["benchdeck"]
