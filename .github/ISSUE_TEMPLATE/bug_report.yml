name: Bug report
description: Report incorrect or unexpected behavior
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: |
        **Security vulnerabilities:** do not file a public issue.
        See [SECURITY.md](https://github.com/MerverliPy/BenchDeck/blob/main/SECURITY.md)
        for private reporting instructions.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: |
        Exact commands, inputs, and environment that trigger the bug.
        Include `benchdeck --version` output if available.
      placeholder: |
        1. benchdeck run --agent-a examples/... --model gpt-4o-mini
        2. ...
        3. Observe error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen instead.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, benchdeck version, relevant package versions.
      placeholder: |
        - OS: Ubuntu 24.04 / macOS 14 / Windows 11 WSL2
        - Python: 3.12.3
        - benchdeck: 0.1.0 (pyproject.toml)
        - pip freeze | grep openai
      render: text
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or output
      description: Any stdout, stderr, or traceback.
      render: text
