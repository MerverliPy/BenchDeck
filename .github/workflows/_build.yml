name: Build (reusable)

on:
  workflow_call:
    inputs:
      python-version:
        type: string
        default: "3.12"
    outputs:
      artifact-name:
        value: ${{ jobs.build.outputs.artifact-name }}
      artifact-digest:
        value: ${{ jobs.build.outputs.artifact-digest }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact-name: ${{ steps.vars.outputs.artifact-name }}
      artifact-digest: ${{ steps.digest.outputs.digest }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip

      - name: Install tools
        run: python -m pip install --upgrade pip build

      - name: Verify tag matches pyproject.toml
        run: bash .github/scripts/verify-version-match.sh

      - name: Build wheel and sdist
        run: python -m build

      - name: Verify build metadata matches tag
        run: |
          VERSION="$(python -c "
          import tomllib
          with open('pyproject.toml', 'rb') as f:
              data = tomllib.load(f)
          print(data['project']['version'])
          ")"
          bash .github/scripts/verify-build-metadata.sh "${VERSION}"

      - name: Generate checksums
        run: cd dist && sha256sum * > SHA256SUMS

      - name: Set artifact name
        id: vars
        run: |
          echo "artifact-name=benchdeck-dist-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"

      - name: Compute artifact digest
        id: digest
        run: |
          cd dist
          echo "digest=$(sha256sum * | sha256sum | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.vars.outputs.artifact-name }}
          path: dist/
