name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/_build.yml

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Download build artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: dist/

      - name: Verify artifact digest
        run: |
          cd dist
          EXPECTED="${{ needs.build.outputs.artifact-digest }}"
          ACTUAL="$(sha256sum * | sha256sum | awk '{print $1}')"
          if [ "${ACTUAL}" != "${EXPECTED}" ]; then
            echo "ERROR: Artifact digest mismatch" >&2
            exit 1
          fi
          echo "Artifact digest verified: ${ACTUAL}"

      - name: Verify checksums
        run: cd dist && sha256sum -c SHA256SUMS

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # v0
        with:
          artifact-name: benchdeck-sbom.spdx.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          files: |
            dist/*
            benchdeck-sbom.spdx.json
          generate_release_notes: true
