name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/_build.yml

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Download build artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: dist/

      - name: Verify artifact digest
        run: |
          cd dist
          EXPECTED="${{ needs.build.outputs.artifact-digest }}"
          ACTUAL="$(sha256sum * | sha256sum | awk '{print $1}')"
          if [ "${ACTUAL}" != "${EXPECTED}" ]; then
            echo "ERROR: Artifact digest mismatch" >&2
            exit 1
          fi
          echo "Artifact digest verified: ${ACTUAL}"

      - name: Verify checksums
        run: cd dist && sha256sum -c SHA256SUMS

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          artifact-name: benchdeck-sbom.spdx.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda
        with:
          files: |
            dist/*
            benchdeck-sbom.spdx.json
          generate_release_notes: true
