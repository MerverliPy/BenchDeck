name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/_build.yml

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/benchdeck
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: dist/

      - name: Verify artifact digest
        run: |
          cd dist
          EXPECTED="${{ needs.build.outputs.artifact-digest }}"
          ACTUAL="$(sha256sum * | sha256sum | awk '{print $1}')"
          if [ "${ACTUAL}" != "${EXPECTED}" ]; then
            echo "ERROR: Artifact digest mismatch" >&2
            echo "  expected: ${EXPECTED}" >&2
            echo "  actual:   ${ACTUAL}" >&2
            exit 1
          fi
          echo "Artifact digest verified: ${ACTUAL}"

      - name: Verify checksums
        run: cd dist && sha256sum -c SHA256SUMS

      - name: Check with twine (advisory)
        continue-on-error: true
        run: |
          pip install --upgrade twine
          twine check dist/*.whl dist/*.tar.gz

      - name: Clean dist for upload
        run: rm -f dist/SHA256SUMS

      - name: Select PyPI publish auth
        id: pypi-auth
        env:
          HAS_TOKEN: ${{ secrets.PYPI_API_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" = "true" ]; then
            echo "mode=token" >> "$GITHUB_OUTPUT"
          else
            echo "mode=oidc" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to PyPI (API token)
        if: ${{ steps.pypi-auth.outputs.mode == 'token' }}
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

      - name: Publish to PyPI (Trusted Publishing)
        if: ${{ steps.pypi-auth.outputs.mode == 'oidc' }}
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b
