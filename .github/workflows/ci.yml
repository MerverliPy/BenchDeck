name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Scan for credential leaks
        run: |
          if grep -rqE 'sk-(proj|ant)-[A-Za-z0-9_-]{20,}' . \
            --exclude-dir=.git --exclude-dir=.venv --exclude-dir=.mypy_cache \
            --exclude-dir=.pytest_cache --exclude-dir=.ruff_cache \
            --exclude-dir=dist --exclude-dir=node_modules \
            --exclude-dir=__pycache__ --exclude-dir=*.egg-info \
            --exclude-dir=.product-test --exclude-dir=.opencode; then
            echo "ERROR: OpenAI API key pattern found in repository"
            grep -rnE 'sk-(proj|ant)-[A-Za-z0-9_-]{20,}' . \
              --exclude-dir=.git --exclude-dir=.venv --exclude-dir=.mypy_cache \
              --exclude-dir=.pytest_cache --exclude-dir=.ruff_cache \
              --exclude-dir=dist --exclude-dir=node_modules \
              --exclude-dir=__pycache__ --exclude-dir=*.egg-info \
              --exclude-dir=.product-test --exclude-dir=.opencode
            exit 1
          fi
          echo "No credential patterns found."
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src/benchdeck/
      - run: pytest --cov=src/benchdeck --cov-report=term-missing

  # Visual regression: compares CI-generated screenshots against golden images.
  # Both expected and actual images are produced from the same synthetic
  # _build_demo_snapshot() data, so this detects rendering code drift
  # (font layout, colourization, tab structure) — not behavioral correctness.
  # Rendering resilience with varied data shapes is validated by
  # test_screenshots.py's edge-case snapshot tests.
  visual-regression:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - name: Install system fonts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-dejavu-core fonts-liberation
      - name: Generate screenshots
        run:           python scripts/generate_demo_screens.py -o assets/screenshots/ci/ -w 80 --font-size 15 --font-path /usr/share/fonts/truetype/dejavu/DejaVuSansMono.ttf
      - name: Compare against golden images
        id: visual-diff
        run: |
          set +e
          python - <<'PY'
          import sys
          from pathlib import Path
          from PIL import Image

          golden_dir = Path("assets/screenshots/golden")
          ci_dir = Path("assets/screenshots/ci")
          failed = []

          for golden_path in sorted(golden_dir.glob("*.png")):
              ci_path = ci_dir / golden_path.name
              if not ci_path.exists():
                  print(f"MISSING: {golden_path.name} not generated")
                  failed.append(golden_path.name)
                  continue
              golden = Image.open(golden_path)
              ci_img = Image.open(ci_path)
              if golden.size != ci_img.size:
                  print(f"SIZE MISMATCH: {golden_path.name} golden={golden.size} ci={ci_img.size}")
                  failed.append(golden_path.name)
                  continue
              diff_pixels = 0
              total_pixels = golden.size[0] * golden.size[1]
              g_data = golden.getdata()
              c_data = ci_img.getdata()
              for gp, cp in zip(g_data, c_data):
                  if gp != cp:
                      diff_pixels += 1
              ratio = diff_pixels / total_pixels if total_pixels else 0
              status = "PASS" if ratio < 0.001 else "FAIL"
              print(f"  {golden_path.name}: {diff_pixels}/{total_pixels} pixels differ ({ratio:.4%}) {status}")
              if status == "FAIL":
                  failed.append(golden_path.name)
              golden.close()
              ci_img.close()

          if failed:
              print(f"\nVISUAL REGRESSION DETECTED: {len(failed)} image(s) changed")
              for f in failed:
                  print(f"  - {f}")
              sys.exit(1)
          else:
              print("\nAll screenshots match golden images.")
          PY
      - name: Upload CI screenshots (on failure)
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: screenshots-ci
          path: assets/screenshots/ci/
      - name: Upload golden images (on failure)
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: screenshots-golden
          path: assets/screenshots/golden/
